<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Mastery Workout Guide</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f6;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #4f46e5;
        --accent-2: #7c3aed;
        --border: #e5e7eb;
        --shadow: 0 12px 40px rgba(15, 23, 42, 0.15);
        --table-head: #eef2ff;
        --note: #fff7ed;
        --note-border: #fb923c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --panel: #111827;
          --text: #e5e7eb;
          --muted: #cbd5e1;
          --accent: #818cf8;
          --accent-2: #c084fc;
          --border: #1f2937;
          --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
          --table-head: #1f2937;
          --note: #1f2937;
          --note-border: #fb923c;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(79, 70, 229, 0.12),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(124, 58, 237, 0.12),
            transparent 25%
          ),
          var(--bg);
        min-height: 100vh;
        padding: 24px;
        color: var(--text);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        color: #ffffff;
        padding: 28px 32px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
      }

      .header p {
        font-size: 1rem;
        opacity: 0.92;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 12px;
        padding: 20px;
        background: linear-gradient(
          90deg,
          rgba(79, 70, 229, 0.06),
          rgba(124, 58, 237, 0.06)
        );
        border-bottom: 1px solid var(--border);
      }

      .control-block h2 {
        font-size: 1.05rem;
        margin-bottom: 10px;
        color: var(--text);
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }

      .pill-btn {
        padding: 12px 14px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .pill-btn:hover {
        background: var(--accent);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
      }

      .pill-btn.active {
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
      }

      .content {
        padding: 24px;
      }

      .workout-info {
        background: var(--table-head);
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        margin-bottom: 18px;
      }

      .workout-info h2 {
        font-size: 1.4rem;
        margin-bottom: 6px;
      }

      .workout-info p {
        color: var(--muted);
      }

      .exercise-list {
        display: grid;
        gap: 12px;
      }

      .exercise-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--panel);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .exercise-card:hover {
        border-color: var(--accent);
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.12);
      }

      .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .exercise-name {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text);
      }

      .exercise-note {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 4px;
      }

      .expand-icon {
        flex-shrink: 0;
        font-size: 1.3rem;
        color: var(--accent);
        transition: transform 0.2s ease;
      }

      .exercise-card.expanded .expand-icon {
        transform: rotate(180deg);
      }

      /* Expanded view */
      .exercise-expanded {
        display: none;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .exercise-card.expanded .exercise-expanded {
        display: block;
      }

      .expanded-section {
        margin-bottom: 16px;
      }

      .expanded-section-title {
        font-weight: 700;
        color: var(--accent-2);
        margin-bottom: 8px;
        font-size: 1rem;
      }

      .level-specific-info {
        background: var(--table-head);
        padding: 12px;
        border-radius: 8px;
        border-left: 4px solid var(--accent);
        margin-bottom: 12px;
      }

      .info-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        margin-bottom: 8px;
        align-items: start;
      }

      .info-label {
        font-weight: 600;
        color: var(--accent);
        min-width: 80px;
      }

      .info-value {
        color: var(--text);
      }

      .level-cue {
        background: rgba(124, 58, 237, 0.08);
        padding: 10px 12px;
        border-radius: 6px;
        border-left: 3px solid var(--accent-2);
        margin-top: 8px;
        font-size: 0.95rem;
        font-style: italic;
        color: var(--text);
      }

      .directions-text {
        background: var(--table-head);
        padding: 12px;
        border-radius: 8px;
        line-height: 1.7;
      }

      .detail-list {
        margin: 0;
        padding-left: 20px;
        list-style: disc;
        display: grid;
        gap: 8px;
      }

      .detail-paragraph {
        margin: 0;
      }

      .note {
        background: var(--note);
        padding: 12px 14px;
        border-radius: 10px;
        border-left: 4px solid var(--note-border);
        color: var(--text);
        margin-top: 16px;
      }

      .rest-day {
        text-align: center;
        padding: 40px 18px;
      }

      .rest-day h2 {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .rest-day p {
        color: var(--muted);
        font-size: 1.05rem;
      }

      .section-title {
        font-size: 1.15rem;
        margin: 18px 0 10px 0;
        color: var(--accent-2);
      }

      @media (max-width: 960px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        .header h1 {
          font-size: 1.6rem;
        }

        .info-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .info-label {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Body Mastery Training</h1>
        <p>12-week calisthenics plan with level-specific guidance</p>
      </div>

      <div class="controls">
        <div class="control-block">

        </div>
        <div class="control-block">
          <h2>Choose level (Periodization)</h2>
          <div class="button-row" id="level-buttons"></div>
        </div>
      </div>

      <div class="content" id="workout-content"></div>
    </div>

      const dayButtonsContainer = document.getElementById("day-buttons");
      const levelButtonsContainer = document.getElementById("level-buttons");
      const content = document.getElementById("workout-content");

      const dayButtons = [
        { id: 1, label: "Day 1" },
        { id: 2, label: "Day 2" },
        { id: 3, label: "Day 3" },
        { id: 4, label: "Day 4" },
        { id: 5, label: "Day 5" },
        { id: 6, label: "Days 6-7" },
      ];

      let currentDay = 1;
      let currentLevel = "accumulation";

      function renderButtons() {
        dayButtonsContainer.innerHTML = dayButtons
          .map(
            (btn) =>
              `<button class="pill-btn ${btn.id === currentDay ? "active" : ""}" data-day="${btn.id}">${btn.label}</button>`,
          )
          .join("");

        levelButtonsContainer.innerHTML = Object.entries(levels)
          .map(
            ([key, value]) =>
              `<button class="pill-btn ${key === currentLevel ? "active" : ""}" data-level="${key}">${value.label}</button>`,
          )
          .join("");

        dayButtonsContainer.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentDay = Number(btn.dataset.day);
            renderButtons();
            showDay();
          });
        });

        levelButtonsContainer.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentLevel = btn.dataset.level;
            renderButtons();
            showDay();
          });
        });
      }

      function formatDetail(detailText) {
        if (!detailText) return "";
        const parts = detailText
          .split(/(?<=\.)\s+/)
          .map((p) => p.trim())
          .filter(Boolean);

        if (parts.length <= 1) {
          return `<p class="detail-paragraph">${detailText}</p>`;
        }

        return `<ul class="detail-list">${parts
          .map((sentence) => `<li>${sentence}</li>`)
          .join("")}</ul>`;
      }

      function renderExercises(exercises, dayId) {
        return exercises
          .map(
            (ex, idx) => `
          <div class="exercise-card" data-idx="${idx}">
            <div class="exercise-header">
              <div>
                <div class="exercise-name">${ex.name}</div>
                <div class="exercise-note">${ex.notes || ""}</div>
              </div>
              <div class="expand-icon">▼</div>
            </div>
            <div class="exercise-expanded">
              <div class="expanded-section">
                <div class="expanded-section-title">How to Do It</div>
                <div class="directions-text">${formatDetail(ex.detail)}</div>
              </div>
              
              ${
                ex.levels && ex.levels[currentLevel]
                  ? `
                <div class="expanded-section">
                  <div class="expanded-section-title">${levels[currentLevel].label}</div>
                  <div class="level-specific-info">
                    ${
                      ex.levels[currentLevel].sets !== "—"
                        ? `<div class="info-row">
                        <div class="info-label">Sets</div>
                        <div class="info-value">${ex.levels[currentLevel].sets}</div>
                      </div>`
                        : ""
                    }
                    ${
                      ex.levels[currentLevel].reps
                        ? `<div class="info-row">
                        <div class="info-label">${ex.levels[currentLevel].sets === "—" ? "Time" : "Reps/Time"}</div>
                        <div class="info-value">${ex.levels[currentLevel].reps}</div>
                      </div>`
                        : ""
                    }
                    ${
                      ex.levels[currentLevel].rest !== "—"
                        ? `<div class="info-row">
                        <div class="info-label">Rest</div>
                        <div class="info-value">${ex.levels[currentLevel].rest}</div>
                      </div>`
                        : ""
                    }
                    <div class="level-cue">${ex.levels[currentLevel].cue}</div>
                  </div>
                </div>
              `
                  : ""
              }
            </div>
          </div>
        `,
          )
          .join("");
      }

      function renderActivities(activities) {
        return activities
          .map(
            (act, idx) => `
          <div class="exercise-card" data-idx="${idx}">
            <div class="exercise-header">
              <div>
                <div class="exercise-name">${act.name}</div>
              </div>
              <div class="expand-icon">▼</div>
            </div>
            <div class="exercise-expanded">
              <div class="expanded-section">
                <div class="expanded-section-title">How to Do It</div>
                <div class="directions-text">${formatDetail(act.detail)}</div>
              </div>
            </div>
          </div>
        `,
          )
          .join("");
      }

      function attachCardToggle() {
        document.querySelectorAll(".exercise-card").forEach((card) => {
          card.addEventListener("click", () => {
            document
              .querySelectorAll(".exercise-card")
              .forEach((c) => c.classList.remove("expanded"));
            card.classList.add("expanded");
          });
        });
      }

      function showDay() {
        const workout = workouts[currentDay];

        if (workout.isRestDay) {
          content.innerHTML = `
            <div class="rest-day">
              <h2>${workout.title}</h2>
              <p>${workout.description}</p>
              <div class="note" style="margin-top:16px; text-align:left;">
                <strong>Level guidance:</strong> ${levels[currentLevel].summary}
              </div>
            </div>
          `;
          return;
        }

        if (workout.activities) {
          content.innerHTML = `
            <div class="workout-info">
              <h2>${workout.title}</h2>
              <p>${workout.subtitle}</p>
              <p style="margin-top:6px;">${workout.description}</p>
            </div>
            <h3 class="section-title">Activities</h3>
            <div class="exercise-list">
              ${renderActivities(workout.activities)}
            </div>
            <div class="note">
              Keep intensity low. Move smoothly and breathe through the motions. Stop if joints feel irritated.
            </div>
          `;
          attachCardToggle();
          return;
        }

        content.innerHTML = `
          <div class="workout-info">
            <h2>${workout.title}</h2>
            <p>${workout.subtitle}</p>
            <p style="margin-top:6px;">${workout.description}</p>
          </div>
          <h3 class="section-title">Exercises</h3>
          <div class="exercise-list">
            ${renderExercises(workout.exercises, currentDay)}
          </div>
          <div class="note">
            Click any exercise to expand and see level-specific sets, reps, rest times, and detailed instructions.
          </div>
        `;

        attachCardToggle();
      }

      renderButtons();
      showDay();
