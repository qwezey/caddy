<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Body Mastery Training</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <header>
      <h1>Body Mastery</h1>
      <div id="level-badge" class="level-badge">Loading...</div>
    </header>

    <main>
      <div id="day-selector" class="day-selector">
        <!-- Injected by JS -->
      </div>

      <div id="content">
        <!-- Injected by JS -->
      </div>
    </main>

    <!-- Timer Bar -->
    <div id="timer-bar" class="timer-bar">
      <div class="timer-controls">
        <div id="timer-display" class="timer-display">00:00</div>
      </div>
      <div class="timer-controls">
        <button id="timer-toggle" class="timer-btn primary">Pause</button>
        <button id="timer-reset" class="timer-btn">Stop</button>
      </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-content" class="modal">
        <!-- Injected JS -->
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
