<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <mask id="moon-mask">
      <rect width="512" height="512" fill="white" />
      <circle cx="330" cy="180" r="220" fill="black" />
    </mask>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0b1120" />
  
  <!-- Big Crescent Moon Background -->
  <circle cx="256" cy="256" r="220" fill="#0ea5e9" opacity="0.35" mask="url(#moon-mask)" />
  
  <!-- Number 79 -->
  <text x="246" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="280" fill="#ffffff" text-anchor="middle">79</text>
  
  <!-- Subtext with elegant font -->
  <text x="256" y="430" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-weight="400" font-size="60" fill="#7dd3fc" text-anchor="middle" letter-spacing="14">PRAYERS</text>
</svg>
