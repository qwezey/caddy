<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="256"
  height="256"
  style="width: 100%; max-width: 512px; height: auto"
>
  <defs>
    <!-- Apple standard app icon rounded corner clip -->
    <clipPath id="app-icon-clip">
      <rect width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Deep emerald night sky gradient -->
    <radialGradient
      id="bg-gradient"
      cx="50%"
      cy="40%"
      r="75%"
      fx="50%"
      fy="20%"
    >
      <stop offset="0%" stop-color="#045c4a" />
      <!-- Lighter vibrant emerald -->
      <stop offset="60%" stop-color="#022c22" />
      <!-- Deep emerald -->
      <stop offset="100%" stop-color="#011812" />
      <!-- Near black -->
    </radialGradient>

    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="25%" stop-color="#F3B93A" />
      <stop offset="50%" stop-color="#FFF2A8" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Subtle gold for background elements -->
    <linearGradient id="soft-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F3B93A" stop-opacity="0.1" />
    </linearGradient>

    <!-- Crescent Moon Mask -->
    <mask id="crescent-mask">
      <circle cx="240" cy="280" r="160" fill="white" />
      <!-- Offset inner circle to carve out the crescent shape -->
      <circle cx="290" cy="230" r="160" fill="black" />
    </mask>

    <!-- Single Rub el Hizb (8-pointed star) base shape for the mandala -->
    <g id="rub-el-hizb">
      <rect
        x="-40"
        y="-40"
        width="80"
        height="80"
        fill="none"
        stroke="url(#soft-gold)"
        stroke-width="2"
      />
      <rect
        x="-40"
        y="-40"
        width="80"
        height="80"
        fill="none"
        stroke="url(#soft-gold)"
        stroke-width="2"
        transform="rotate(45)"
      />
      <circle
        cx="0"
        cy="0"
        r="10"
        fill="none"
        stroke="url(#soft-gold)"
        stroke-width="1.5"
      />
    </g>

    <!-- Drop shadow for the main text to lift it off the background -->
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="15"
        flood-color="#000000"
        flood-opacity="0.7"
      />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- All elements clipped to the standard squircle shape -->
  <g clip-path="url(#app-icon-clip)">
    <!-- 1. Background -->
    <rect width="512" height="512" fill="url(#bg-gradient)" />

    <!-- 2. Islamic Geometric Mandala Pattern (Background) -->
    <g transform="translate(256, 256)" opacity="0.6">
      <!-- Layer 1 -->
      <use href="#rub-el-hizb" transform="scale(1.5)" />
      <use
        href="#rub-el-hizb"
        transform="scale(1.5) rotate(22.5)"
        opacity="0.5"
      />
      <!-- Layer 2 -->
      <use href="#rub-el-hizb" transform="scale(3)" />
      <use
        href="#rub-el-hizb"
        transform="scale(3) rotate(22.5)"
        opacity="0.5"
      />
      <!-- Layer 3 -->
      <use href="#rub-el-hizb" transform="scale(4.5)" />
      <use
        href="#rub-el-hizb"
        transform="scale(4.5) rotate(22.5)"
        opacity="0.5"
      />
    </g>

    <!-- 3. Scattered Stars / Night Sky -->
    <circle
      cx="120"
      cy="140"
      r="2.5"
      fill="#FFE066"
      opacity="0.7"
      filter="url(#glow)"
    />
    <circle cx="410" cy="180" r="1.5" fill="#FFF" opacity="0.5" />
    <circle cx="360" cy="380" r="2" fill="#FFE066" opacity="0.4" />
    <circle cx="100" cy="350" r="1.5" fill="#FFF" opacity="0.6" />

    <!-- 4. Mihrab (Islamic Prayer Arch) framing the icon -->
    <path
      d="M 50,480 
                         L 50,280 
                         A 240,240 0 0,1 256,70 
                         A 240,240 0 0,1 462,280 
                         L 462,480"
      fill="none"
      stroke="url(#gold-gradient)"
      stroke-width="6"
      opacity="0.4"
      filter="url(#glow)"
    />
    <path
      d="M 70,480 
                         L 70,280 
                         A 220,220 0 0,1 256,90 
                         A 220,220 0 0,1 442,280 
                         L 442,480"
      fill="none"
      stroke="url(#gold-gradient)"
      stroke-width="2"
      opacity="0.2"
    />

    <!-- 5. Crescent Moon -->
    <g filter="url(#glow)">
      <circle
        cx="240"
        cy="280"
        r="160"
        fill="url(#gold-gradient)"
        opacity="0.8"
        mask="url(#crescent-mask)"
      />
    </g>

    <!-- 6. 8-Pointed Star Accent (Top Right to balance the crescent) -->
    <g transform="translate(390, 140) scale(0.6)" filter="url(#glow)">
      <polygon
        points="0,-30 6,-6 30,0 6,6 0,30 -6,6 -30,0 -6,-6"
        fill="url(#gold-gradient)"
      />
      <polygon
        points="0,-30 6,-6 30,0 6,6 0,30 -6,6 -30,0 -6,-6"
        fill="url(#gold-gradient)"
        transform="rotate(45)"
      />
      <circle cx="0" cy="0" r="4" fill="#022c22" />
    </g>

    <!-- 7. The Hero: "79" with 3D Extrusion Effect -->
    <g
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="240"
      text-anchor="middle"
      letter-spacing="-8"
    >
      <!-- Deepest shadow/back face -->
      <text x="256" y="340" fill="#4B3619" filter="url(#text-shadow)">79</text>
      <!-- Mid extrusions for 3D depth -->
      <text x="256" y="337" fill="#8B6508">79</text>
      <text x="256" y="334" fill="#B38728">79</text>
      <text x="256" y="331" fill="#D4AF37">79</text>
      <!-- Front face -->
      <text x="256" y="328" fill="url(#gold-gradient)">79</text>
    </g>

    <!-- 8. App Name Text (Subtle support below the main element) -->
    <text
      x="256"
      y="435"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-weight="700"
      font-size="26"
      fill="#a7f3d0"
      text-anchor="middle"
      letter-spacing="12"
      opacity="0.9"
      filter="url(#glow)"
    >
      PRAYERS
    </text>

    <!-- 9. Glossy Screen Reflection / Premium App Overlay -->
    <path
      d="M 0,0 L 512,0 L 512,180 C 350,260 150,180 0,100 Z"
      fill="#ffffff"
      opacity="0.04"
    />

    <!-- Inner Border for polish -->
    <rect
      width="512"
      height="512"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      opacity="0.1"
    />
  </g>
</svg>
