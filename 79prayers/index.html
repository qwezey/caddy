<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>79Prayers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Modern Web App capabilities -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="79Prayers" />
    <meta name="theme-color" content="#0ea5e9" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand">
          <h1>79Prayers</h1>
          <p id="todayDate" class="date-subtitle"></p>
        </div>
        <div class="settings">
          <label class="notify-container" for="notifySwitch">
            <div class="notify-info">
              <span class="notify-label">Notifications</span>
              <span id="notifyHint" class="notify-status">Click to allow</span>
            </div>
            <div class="switch">
              <input type="checkbox" id="notifySwitch" />
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </header>

      <main>
        <!-- Hero Next Event Card -->
        <section id="nextEventCard" class="hero-card" aria-live="polite">
          <div class="hero-top">
            <div class="hero-label">
              Upcoming <span id="heroType">Event</span>
            </div>
            <div
              id="heroTitle"
              class="hero-title"
              aria-label="Loading next prayer"
            >
              Loading...
            </div>
          </div>
          <div class="hero-bottom">
            <div class="hero-time">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span id="heroTime">--:--</span>
            </div>
            <div id="heroCountdown" class="hero-countdown">--h --m --s</div>
          </div>
        </section>

        <!-- Prayer Times Grid -->
        <section class="schedule-section">
          <h2 class="section-title">Today's Schedule</h2>
          <div id="timesGrid" class="times-grid">
            <!-- Filled by JS -->
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
